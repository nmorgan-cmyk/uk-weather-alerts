<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
</head>
<body>
  <canvas id="canvas192" width="192" height="192"></canvas>
  <canvas id="canvas512" width="512" height="512"></canvas>
  <br>
  <button onclick="download(192)">Download 192x192</button>
  <button onclick="download(512)">Download 512x512</button>

  <script>
    function drawIcon(size) {
      const canvas = document.getElementById('canvas' + size);
      const ctx = canvas.getContext('2d');
      
      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#3B82F6');
      gradient.addColorStop(1, '#6366F1');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Sun icon
      ctx.fillStyle = '#FCD34D';
      ctx.beginPath();
      ctx.arc(size/2, size/2, size/4, 0, Math.PI * 2);
      ctx.fill();
      
      // Sun rays
      const rayCount = 8;
      const rayLength = size/8;
      for (let i = 0; i < rayCount; i++) {
        const angle = (Math.PI * 2 / rayCount) * i;
        const x1 = size/2 + Math.cos(angle) * (size/3);
        const y1 = size/2 + Math.sin(angle) * (size/3);
        const x2 = size/2 + Math.cos(angle) * (size/3 + rayLength);
        const y2 = size/2 + Math.sin(angle) * (size/3 + rayLength);
        
        ctx.strokeStyle = '#FCD34D';
        ctx.lineWidth = size/20;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }
    
    drawIcon(192);
    drawIcon(512);
    
    function download(size) {
      const canvas = document.getElementById('canvas' + size);
      const url = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'icon-' + size + '.png';
      link.href = url;
      link.click();
    }
  </script>
</body>
</html>
